<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e12">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>auto2 · 로그인</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: #0c0e12; color: #e7e9ee;
    font: 14px/1.5 Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  form { width: 100%; max-width: 340px; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; margin-bottom: 4px; }
  .sub { color: #8a909c; font-size: 13px; margin-bottom: 24px; }
  label { display: block; color: #8a909c; font-size: 12px; margin-bottom: 6px; }
  input {
    width: 100%; height: 44px; padding: 0 12px; border-radius: 6px; font: inherit; font-size: 16px;
    background: #14171c; color: inherit; border: 1px solid #262a31; outline: none;
  }
  input:focus { border-color: #5b8def; }
  button {
    width: 100%; height: 44px; margin-top: 12px; border: 0; border-radius: 6px; cursor: pointer;
    background: #e7e9ee; color: #0c0e12; font: inherit; font-weight: 600;
  }
  .err { color: #f0616d; font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <div class="brand">auto2</div>
    <div class="sub">바깥 네트워크에서 접속했습니다. .env의 DASHBOARD_TOKEN을 입력하세요.</div>
    <label for="token">접속 비밀번호</label>
    <input id="token" name="token" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">들어가기</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
